name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tests exercise the node module's Comfy-, PyAV- and nelux-independent
      # surface, so neither ComfyUI nor nelux is installed -- the CPU torch
      # wheel keeps CI cheap. numpy is a genuine runtime dependency of the audio
      # muxing path (see requirements.txt).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pytest

      - name: Run tests
        run: python -m pytest tests -q
